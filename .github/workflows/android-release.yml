name: Android Release Build

# Debug APK already builds on every push via build.yml.
# This job runs only for a version tag (v1.0.0) or a manual run,
# so a push does not build the app twice.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      # npm 10.8 (Node 20) crashes on this lockfile: edgesOut of null.
      # Node 22 can read it. If ci still fails, install is the fallback
      # already used by the working build workflow.
      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Tests
        run: TZ=Asia/Karachi npm test

      - name: Run Linter & Type Check
        run: npm run lint

      - name: Build Web Assets
        run: npm run build

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pakistan-trader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
